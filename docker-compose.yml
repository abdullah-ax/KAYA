# One command: docker compose up
# Local use only: every host port is bound to 127.0.0.1.
# Works with no .env. Set SEARXNG_SECRET in .env if you ever expose search beyond this machine.

services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  ollama-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    # Light model first so the app is usable within minutes; the larger one follows.
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3:8b; ollama pull gpt-oss:20b || true"]
    restart: "no"

  searxng:
    image: searxng/searxng:2026.11.17-b99cf7496
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-local-only-change-if-exposed}
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - RUNS_DIR=/app/runs
    volumes:
      - ./runs:/app/runs
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      - ollama
      - searxng
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  ollama:
