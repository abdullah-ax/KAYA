# One command: docker compose up
# Draft: Claude Code adjusts build paths once api/ and web/ exist.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${MODEL_DEFAULT:-gpt-oss:20b} || ollama pull ${MODEL_FALLBACK:-qwen3:8b}"]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-local-only}
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - RUNS_DIR=/app/runs
    volumes:
      - ./runs:/app/runs
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      - ollama
      - searxng
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ollama:
